app = "mrp-backend"
primary_region = "sin" # Singapore (or bom for Mumbai, fra for Frankfurt, iad for Virginia)

[build]
  dockerfile = "backend/Dockerfile"

[env]
  APP_ENV = "production"
  DEBUG = "false"
  DEFAULT_CURRENCY = "INR"
  BUSINESS_TIMEZONE = "Asia/Kolkata"
  SEED_DEMO = "true"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[http_service.checks]]
  grace_period = "10s"
  interval = "15s"
  method = "GET"
  timeout = "3s"
  path = "/api/health"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
