services:
  db:
    image: postgres:16-alpine
    container_name: mrp_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mrp}
      POSTGRES_USER: ${POSTGRES_USER:-mrp_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mrp_secure_password_2026}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mrp_user} -d ${POSTGRES_DB:-mrp}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - mrp_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mrp_backend
    restart: unless-stopped
    environment:
      APP_NAME: "MRP Management System"
      APP_ENV: "production"
      DEBUG: "false"
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-mrp_user}:${POSTGRES_PASSWORD:-mrp_secure_password_2026}@db:5432/${POSTGRES_DB:-mrp}
      SEED_DEMO: ${SEED_DEMO:-true}
      CORS_ORIGINS: '["http://localhost", "http://localhost:80", "http://localhost:3000", "http://localhost:5173", "http://127.0.0.1"]'
      SECRET_KEY: ${SECRET_KEY:-mrp_default_production_key_replace_in_env_file}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - mrp_network
    expose:
      - "8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mrp_frontend
    restart: unless-stopped
    ports:
      - "${PORT:-80}:80"
    depends_on:
      - backend
    networks:
      - mrp_network

volumes:
  postgres_data:
    name: mrp_postgres_data

networks:
  mrp_network:
    name: mrp_network
